server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip for static assets.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # SPA routing: any non-file path falls back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy the API to the backend, same-origin (no CORS).
  location /api/ {
    # Defer DNS to REQUEST time via Docker's embedded resolver, so nginx STARTS even
    # if the backend is down, and picks up its new IP after a restart. A static
    # upstream host is resolved once at startup and 'emerg's if unresolvable.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream http://backend:3000;
    # Strip /api (backend routes have none). With a variable proxy_pass, the trailing-slash
    # trick doesn't apply, so rewrite explicitly.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
